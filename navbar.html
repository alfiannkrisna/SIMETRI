<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMETRI</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <svg width="0" height="0" class="absolute" aria-hidden="true">
        <filter id="tint" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0.771 0 0 0 0  0 0.573 0 0 0  0 0 0.433 0 0  0 0 0 1 0" />
        </filter>
    </svg>

    <header class="sticky top-0 z-50">
        <nav class="flex items-center justify-between bg-[#7A3D21] px-6 xl:px-[90px] h-[90px] border-b-[6px] border-[#4C1C0E]">
            <div class="flex items-center gap-16">
                <img src="images/navbar/logo-simetri.png" class="w-[93.8px] h-[92.73px] xl:w-[132px] xl:h-[132px] object-contain" alt="Logo SIMETRI">
                <ul class="hidden xl:flex items-center gap-16 text-[32px] font-normal">
                    <li>
                        <a href="home.html" style="font-family: 'The Wild Breath of Zelda';" class="underline text-[#F9DCB4] hover:text-[#F9DCB4]">Home</a>
                    </li>
                    <li>
                        <a href="tema.html" style="font-family: 'The Wild Breath of Zelda';" class="text-[#C07E4E] hover:text-[#F9DCB4]">Tema</a>
                    </li>
                    <li>
                        <a href="materi.html" style="font-family: 'The Wild Breath of Zelda';" class="text-[#C07E4E] hover:text-[#F9DCB4]">Materi</a>
                    </li>
                    <li>
                        <a href="asik.html" style="font-family: 'The Wild Breath of Zelda';" class="text-[#C07E4E] hover:text-[#F9DCB4]">Asik</a>
                    </li>
                </ul>
            </div>

            <div class="hidden xl:flex items-center justify-end gap-[15px] w-[323.02px] h-[40.22px]">
                <img src="images/navbar/Exclude.png" class="w-[41.58px] h-[41.58px]" alt="X">
                <img src="images/navbar/Tiktok.png" class="w-[41.58px] h-[41.58px]" alt="TikTok">
                <img src="images/navbar/ig-logo.png" class="w-[41.58px] h-[41.58px]" alt="Instagram">
                <img src="images/navbar/yt-logo.png" class="w-[41.58px] h-[41.58px]" alt="YouTube">
            </div>

            <button id="menu-btn" class="flex xl:hidden items-center justify-center w-12 h-12 bg-[#4C1C0E] rounded-[9.35px]" aria-label="Buka menu" aria-expanded="false">
                <svg id="icon-open" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="#F9DCB4" stroke-width="2" stroke-linecap="round">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg id="icon-close" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="#F9DCB4" stroke-width="2" stroke-linecap="round">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </nav>

        <div id="mobile-menu" class="hidden xl:hidden bg-[#F6EBD7] border-b-[6px] border-[#4C1C0E]">
            <ul class="flex flex-col text-[32px] leading-[36px] font-normal">
                <li>
                    <a href="home.html" style="font-family: 'The Wild Breath of Zelda';" class="block w-full py-4 text-center bg-[#F9DCB4] text-[#7A3D21] underline underline-offset-4">Home</a>
                </li>
                <li>
                    <a href="tema.html" style="font-family: 'The Wild Breath of Zelda';" class="block w-full py-4 text-center text-[#C07E4E] hover:bg-[#F9DCB4] hover:text-[#7A3D21]">Tema</a>
                </li>
                <li>
                    <a href="materi.html" style="font-family: 'The Wild Breath of Zelda';" class="block w-full py-4 text-center text-[#C07E4E] hover:bg-[#F9DCB4] hover:text-[#7A3D21]">Materi</a>
                </li>
                <li>
                    <a href="asik.html" style="font-family: 'The Wild Breath of Zelda';" class="block w-full py-4 text-center text-[#C07E4E] hover:bg-[#F9DCB4] hover:text-[#7A3D21]">Asik</a>
                </li>
            </ul>
            <div class="flex items-center justify-center gap-[15px] h-[88.22px] pt-4 pb-8">
                <img src="images/navbar/Exclude.png" style="filter: url(#tint);" class="w-[41.58px] h-[41.58px]" alt="X">
                <img src="images/navbar/Tiktok.png" style="filter: url(#tint);" class="w-[41.58px] h-[41.58px]" alt="TikTok">
                <img src="images/navbar/ig-logo.png" style="filter: url(#tint);" class="w-[41.58px] h-[41.58px]" alt="Instagram">
                <img src="images/navbar/yt-logo.png" style="filter: url(#tint);" class="w-[41.58px] h-[41.58px]" alt="YouTube">
            </div>
        </div>
    </header>

    <script>
        const btn = document.getElementById('menu-btn');
        const menu = document.getElementById('mobile-menu');
        const iconOpen = document.getElementById('icon-open');
        const iconClose = document.getElementById('icon-close');

        btn.addEventListener('click', () => {
            const isOpen = !menu.classList.contains('hidden');
            menu.classList.toggle('hidden');
            iconOpen.classList.toggle('hidden');
            iconClose.classList.toggle('hidden');
            btn.setAttribute('aria-expanded', String(!isOpen));
        });
    </script>
</body>

</html>
